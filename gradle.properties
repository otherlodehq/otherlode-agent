kotlin.code.style=official
# The release number of every project in this build, the agent and the testkit among them (ADR 0062). A
# release tag vX.Y.Z must match it without the -SNAPSHOT suffix.
version=0.1.0-SNAPSHOT
# The compiler matrix (ADR 0055): the kotlinc releases and javac versions the fixtures under
# fixtures-compilers are compiled with. Read by those builds, by the root test task and, through
# system properties, by the tests, so one list decides what is built and what is tested.
otherlode.matrix.kotlinc=1.9.25,2.1.21,2.2.21,2.4.20
otherlode.matrix.javac=17,21,25

# The Scala compiler matrix (ADR 0055): the scalac releases the fixtures under fixtures-compilers/scalac
# are compiled with, one build per variant boundary. A release below 3 compiles fixtures-scala2's
# sources, a 3.x release fixtures-scala3's. The baseline modules stay on 2.13.15 and 3.3.4.
otherlode.matrix.scalac=2.12.20,2.13.16,2.13.18,3.3.3,3.3.6,3.3.7,3.3.8,3.7.0,3.7.2,3.8.3,3.8.4,3.9.0
