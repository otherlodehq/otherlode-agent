name: buf

on:
  push:
    branches: [master]
    paths:
      - "src/main/proto/**"
      - "buf.yaml"
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "src/main/proto/**"
      - "buf.yaml"
      - ".github/workflows/buf.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Two runs in flight could land out of order and move the label back to the older schema.
concurrency:
  group: buf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A push or manual run checks against what the registry serves, so shipping an intended
      # break needs a manual push.
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          token: ${{ secrets.BUF_TOKEN }}
          lint: true
          format: true
          breaking: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'buf skip breaking') }}
          breaking_against_registry: ${{ github.event_name != 'pull_request' }}
          push: false
      - name: Push to the registry
        if: github.event_name == 'push'
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: buf push --exclude-unnamed --label master --source-control-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
