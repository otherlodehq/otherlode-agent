name: gradle

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build (tests on JDK ${{ matrix.test-jdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 21 is the toolchain everything compiles with. 17 is the oldest JVM the agent and the testkit
        # support, and 25 is the newest LTS: the agent reads JDK internals (the lambda factory in
        # ADR 0035), and a rename in either has to fail a test.
        test-jdk: [17, 21, 25]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # The last version listed becomes JAVA_HOME and runs Gradle. Each version is also
          # exported as JAVA_HOME_<version>_X64, which is how Gradle finds it as a toolchain.
          # 17 and 25 are test JVMs and the javac fixture toolchains (fixtures-compilers/javac),
          # beside the test JDK and the 21 everything else compiles with.
          java-version: |
            17
            25
            ${{ matrix.test-jdk }}
            21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # `build` runs every module's tests, shadowJar, and verifyAgentJar. otherlode.testJdk picks the
      # JVM the tests run on; compilation stays on the JDK 21 toolchain.
      - run: >-
          ./gradlew build --no-daemon
          -Potherlode.testJdk=${{ matrix.test-jdk }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64,JAVA_HOME_${{ matrix.test-jdk }}_X64
      # Builds the Central Portal deployment and checks it, with no key and no upload. One leg is
      # enough: the deployment does not depend on the test JVM, and the testkit's Dokka run is slow.
      - if: matrix.test-jdk == 21
        run: >-
          ./gradlew verifyPublication --no-daemon
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-reports-jdk${{ matrix.test-jdk }}
          path: |
            build/reports/tests/
            demo/build/reports/tests/
            testkit/build/reports/tests/
            endpoints-*/build/reports/tests/

  jacoco-check:
    name: check with JaCoCo on every test JVM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # 17 and 25 are the javac fixture toolchains; 21 is last, so it runs Gradle.
          java-version: |
            17
            25
            21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # The init script applies the `jacoco` plugin to every Java project, so every test JVM runs
      # with JaCoCo's agent beside Otherlode's, the way an adopter's test task does. `check` rather
      # than `test`, so every test suite runs that way.
      - run: >-
          ./gradlew --init-script gradle/jacoco-check.init.gradle.kts check --no-daemon
          -Potherlode.testJdk=21
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-reports-jacoco-check
          path: |
            build/reports/tests/
            demo/build/reports/tests/
            testkit/build/reports/tests/
            endpoints-*/build/reports/tests/
