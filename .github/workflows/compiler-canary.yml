name: compiler-canary

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: an unread compiler release (a red build means a compiler writes a shape the agent has not read)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          # The same JDKs the build job installs. The javac fixtures use 17, 21 and 25 as toolchains.
          java-version: |
            17
            25
            21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - id: newest
        run: .github/scripts/newest-compilers.sh --github
      - name: Compile the fixtures with the newest compilers and run the matrix tests
        run: >-
          ./gradlew :test --no-daemon
          --tests '*MatrixTest*'
          ${{ steps.newest.outputs.args }}
          -Potherlode.testJdk=21
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
      - name: What a failure means
        if: failure()
        run: |
          {
            echo "A matrix test failed with the newest compiler releases (${{ steps.newest.outputs.args }})."
            echo "Most likely a release writes a shape the agent has not read. Read it with javap, extend the rules,"
            echo "and add a Scala 3 release to scala3-read-releases.txt once the matrix passes for it (ADR 0055)."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error title=Unread compiler release::a matrix test failed with the newest compiler releases"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: canary-test-reports
          path: build/reports/tests/
