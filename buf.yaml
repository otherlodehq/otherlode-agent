version: v2
modules:
  - path: src/main/proto
    name: buf.build/otherlode/otherlode
lint:
  use:
    - STANDARD
  except:
    # The rule requires each value to start with its enum's name. Every
    # generated constant would then repeat the type name (Go
    # ProbeKind_PROBE_KIND_METHOD, Java ProbeKind.PROBE_KIND_METHOD), and the
    # value names the collector and server read would change.
    - ENUM_VALUE_PREFIX
    # KotlinKind and BodyKind sit outside any oneof, and their zero value NONE is a
    # real value ("not a Kotlin construct", "no body class"), not an absent or
    # invalid one. Naming it UNSPECIFIED would misstate what it means for the
    # sake of this rule alone. GeneratedBy, UnreadShape and RoutineKind are only
    # set inside an origin oneof, so their zero values are UNSPECIFIED.
    - ENUM_ZERO_VALUE_SUFFIX
breaking:
  use:
    - FILE
